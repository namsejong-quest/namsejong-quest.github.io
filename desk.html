<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남세종 QUEST</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
  // Wide mouse screens get a phone frame; phones and touch tablets go straight to the app.
  if (innerWidth < 760 || window.top !== window.self || matchMedia('(hover: none) and (pointer: coarse)').matches) location.replace('./');
  else history.replaceState(null, '', './');
</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #F2F4F6; color: #191F28; font-family: Pretendard, 'Malgun Gothic', sans-serif; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px; overflow: hidden; }
  .info { max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
  .info img.icon { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 8px 24px rgba(49,130,246,.25); }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -.02em; }
  .sub { font-size: 18px; line-height: 1.55; color: #4E5968; }
  .qr { display: flex; gap: 16px; align-items: center; background: #fff; border-radius: 20px; padding: 16px; margin-top: 8px; }
  .qr img { width: 112px; height: 112px; }
  .qr b { display: block; font-size: 17px; margin-bottom: 6px; }
  .qr span { font-size: 14px; line-height: 1.5; color: #6B7684; }
  .note { font-size: 13px; color: #8B95A1; line-height: 1.6; }
  .phone { --w: 390px; --h: 844px; width: calc(var(--w) + 24px); height: calc(var(--h) + 24px); padding: 12px; border-radius: 52px; background: #191F28; box-shadow: 0 30px 80px rgba(25,31,40,.22); transform-origin: center; flex: none; }
  .phone iframe { width: var(--w); height: var(--h); border: 0; border-radius: 40px; background: #fff; display: block; }
  @media (max-width: 980px) { .info { display: none; } }
</style>
</head>
<body>
<div class="info">
  <img class="icon" src="icon.png" alt="">
  <h1>남세종 QUEST</h1>
  <p class="sub">남세종종합청소년센터를 하나씩 탐험하는 퀘스트 앱이에요.<br>청소년 8명의 기획안을 모아 만들었어요.</p>
  <div class="qr">
    <img src="qr.png" alt="namsejong-quest.github.io QR 코드">
    <div><b>휴대폰으로 열기</b><span>카메라로 QR을 찍으면 바로 열려요.<br>안드로이드·아이폰 모두 설치 없이 쓸 수 있어요.</span></div>
  </div>
  <p class="note">기록은 쓰고 있는 기기의 브라우저에 저장돼요.<br>휴대폰에서 브라우저 메뉴의 ‘홈 화면에 추가’를 누르면 앱처럼 열 수 있어요.</p>
</div>
<div class="phone" id="phone"><iframe src="index.html" title="남세종 QUEST 앱 화면"></iframe></div>
<script>
  const fit = () => { const p = document.getElementById('phone'), s = Math.min(1, (innerHeight - 48) / 868); p.style.transform = `scale(${s})`; p.style.margin = `${-(1 - s) * 434}px ${-(1 - s) * 207}px`; };
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
